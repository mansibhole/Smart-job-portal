spring.application.name=smart-job-portal

# DATABASE
spring.datasource.url=jdbc:mysql://localhost:3306/smart_job_portal
spring.datasource.username=root
spring.datasource.password=mansi555
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# SERVER
server.port=8080

# JWT
jwt.secret=yourVerySecretKeyForJWTAuthentication123456789012345678901234567890
jwt.expiration=86400000

# FILE UPLOAD
file.upload-dir=uploads/resumes

# Multipart
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# SECURITY LOGS
logging.level.org.springframework.security=TRACE